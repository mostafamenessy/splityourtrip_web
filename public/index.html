    <script>
      // Some bundled third-party SDKs (e.g. Firebase Analytics/Installations)
      // reject an internal background promise with a raw { head, body } wire
      // envelope instead of an Error. This happens deep inside their minified
      // code, in a promise no application .catch() can reach. In production it
      // is harmless (just a console warning), but webpack-dev-server's dev
      // overlay renders it as a blocking "[object Object]" error screen.
      // This handler is declared in <head> so it registers BEFORE the webpack
      // client, letting it stopImmediatePropagation() the overlay's own
      // listener - but ONLY for this exact known shape. Every other rejection
      // propagates normally and still shows the overlay.
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        if (reason && typeof reason === 'object' && 'head' in reason && 'body' in reason) {
          console.warn('Suppressed known third-party SDK internal rejection:', reason);
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>

    <!--
      Performance notes:
      - Paytm, MercadoPago: SDKs load on demand inside their payment components
        (see src/loadExternalScript.js), not globally on every page.
      - Midtrans, 2Checkout, SenangPay: their components don't call the vendor
        SDK at all (server-redirect / plain form POST flows), so no script tag
        is needed for them anywhere.
      - Google Maps JS API: loaded by the google-map-react npm package itself
        (with its own key) only on the property detail page. The old raw
        <script src="maps.googleapis.com/..."> tag and its marker.js/
        infobox.min.js helpers were unused dead weight and have been removed.
      - apexcharts/area-chart/morris/raphael: unused by the React dashboard
        (leftover from the original static HTML template) - removed.
      - bootstrap-select.min.js: its .selectpicker() plugin is never called
        anywhere in the React source (only its CSS is used for styling) and
        the script itself throws on load under jQuery 3.x (jQuery removed
        $.fn.valHooks that this old plugin version depends on) - removed.
      - All remaining scripts below are deferred so they no longer block the
        initial HTML parse/paint; defer preserves execution order.
    -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
